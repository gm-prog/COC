name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck · lint · test · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # `Report browser test failure on the PR` comments on the pull request.
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      # sim-core carries coverage thresholds (see vitest.config.ts); a regression
      # below them fails the build rather than silently shrinking the safety net.
      - name: Coverage thresholds
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      # Phase 3 browser smoke test. `--with-deps` installs Chromium plus the
      # system libraries headless Chromium needs on the runner image; the test
      # itself starts the Vite client through Playwright's `webServer`.
      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser smoke test
        run: |
          set -o pipefail
          pnpm test:e2e 2>&1 | tee /tmp/e2e.log

      # Actions logs and artifacts are served from hosts that some networks
      # block, so a browser-test failure is also posted on the pull request:
      # the tail of the Playwright output plus each `error-context.md` page
      # snapshot. A single marker comment is reused and updated in place.
      - name: Report browser test failure on the PR
        if: failure() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo '<!-- playwright-failure -->'
            echo '### Browser smoke test failed'
            echo
            echo '```'
            tail -n 80 /tmp/e2e.log || true
            echo '```'
            for context in test-results/*/error-context.md; do
              [ -f "$context" ] || continue
              echo
              echo '<details><summary>Page snapshot</summary>'
              echo
              echo '```yaml'
              head -n 120 "$context"
              echo '```'
              echo '</details>'
            done
          } > /tmp/e2e-comment.md
          existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.body | contains("<!-- playwright-failure -->")) | .id' \
            | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" \
              -F body=@/tmp/e2e-comment.md > /dev/null
          else
            gh pr comment "$PR_NUMBER" --body-file /tmp/e2e-comment.md > /dev/null
          fi

      # Keep the failure evidence: the HTML report plus any traces, screenshots
      # and video that `playwright.config.ts` retains on failure.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright test artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
